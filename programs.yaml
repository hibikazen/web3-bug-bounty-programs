# web3-bug-bounty-programs — source of truth.
#
# Every entry was checked against a live program page (or the project's own
# docs/repo) on the last_verified date. Figures come from the program page or
# from the maintainer's own survey notes; anything unconfirmed is null and the
# notes say "check program page" instead of inventing a number.
#
# Fields:
#   name            Program name
#   platform        Where reports are filed (Self-hosted, Immunefi, Remedy, ...)
#   program_url     Public program page (never a contact email)
#   scope           Short scope description
#   scope_url       Repo or docs page describing scope
#   reward_min      Lowest published reward in USD (null = unknown/unpublished)
#   reward_max      Highest published reward in USD (null = unknown/unpublished)
#   reward_notes    Tier details, caps, payout currency
#   kyc             yes / no / unknown (whether identity verification is required,
#                   and the notes say at which stage when known)
#   submission_fee  Cost to file a report ("none" / amount / "check program page")
#   status          active / gated / closed / paused / dead
#                   gated = live program, but filing requires a fee, stake,
#                   reputation gate, or platform verification step
#   last_verified   YYYY-MM-DD — date the program page was last checked live
#   notes           Anything else a hunter needs before starting

